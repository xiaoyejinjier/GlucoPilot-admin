name: Build
on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify
        run: |
          npm ci
          npm run type-check
          npm run build
      - name: Verify Docker build
        run: docker build -t glucopilot-admin:ci .
