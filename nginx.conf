map $http_x_request_id $forward_request_id {
    default $http_x_request_id;
    "" $request_id;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # CMS 视频上限 100MB，默认 1m 会让图片/视频在网关就被 413 拦掉。
    client_max_body_size 110m;

    # 一个公网入口：管理端静态资源、C 端 API 和管理端 API 都通过此 Nginx 转发。
    location /api/v1/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $forward_request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_buffering off;
        # 上传本体可达 100MB：直接透传给后端，避免 Nginx 先落盘整段请求体。
        proxy_request_buffering off;
        proxy_cache off;
    }

    location /admin/v1/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $forward_request_id;
        proxy_connect_timeout 5s;
        # 登记接口要对 100MB 视频做流式哈希，30s 在远端存储下偏紧。
        proxy_read_timeout 90s;
    }

    location /actuator/health {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $forward_request_id;
    }

    # Vue history 路由刷新时回退到入口页。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
